apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultly
  namespace: vaultly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vaultly
  template:
    metadata:
      labels:
        app: vaultly
    spec:
      serviceAccountName: vaultly-sa   
      containers:
        - name: vaultly
          image: vaultly:local
          ports:
            - containerPort: 8080
          env:
            - name: VAULTLY_VAULT_ADDR
              value: http://vault-active.vault.svc:8200
            - name: VAULTLY_VAULT_AUTH_METHOD
              value: kubernetes
            - name: VAULTLY_VAULT_K8S_ROLE
              value: vaultly   
            - name: VAULTLY_API_BEARER_TOKEN
              value: dev-token-change-me
            
---
apiVersion: v1
kind: Service
metadata:
  name: vaultly
  namespace: vaultly
spec:
  selector:
    app: vaultly
  ports:
    - port: 8080
      targetPort: 8080
